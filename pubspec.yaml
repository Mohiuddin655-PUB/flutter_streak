name: flutter_streak
description: "The flutter_streak Dart package provides a simple and flexible way to track user streaks in Flutter apps. It manages streak counts, contribution tracking, and daily progress while persisting data through a delegate system."
version: 2.0.0
repository: https://github.com/Mohiuddin655-PUB/flutter_streak

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

screenshots:
  - description: A streak on a home screen, with the best streak.
    path: screenshots/1_home.png
  - description: A calendar of completed and restored days.
    path: screenshots/2_calendar.png
  - description: Restoring a broken streak.
    path: screenshots/3_restore.png
  - description: A team streak's day, who completed it and who was active.
    path: screenshots/4_team.png
